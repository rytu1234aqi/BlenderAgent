[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blendguard"
version = "0.1.0"
description = "Contract-governed, verifiable local editing for existing Blender assets"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agent = ["openai>=1.0,<3"]
deepseek = ["openai>=1.0,<3"]
claude = ["anthropic>=1.0,<3"]

[project.scripts]
blendguard = "blendguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
